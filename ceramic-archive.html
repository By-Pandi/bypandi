<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceramic Archive — By Pandi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="pages.css">
</head>
<body>

  <div class="page-wrap">

    <header class="page-header">
      <span class="site-name">By Pandi</span>
      <img src="images/logo.jpg" alt="By Pandi logo">
      <a href="index.html" class="back-link">← back to everything</a>
    </header>

    <p class="archive-tag">01 - </p>
    <div class="archive-divider"></div>

    <h1 class="archive-title">Ceramic Archive</h1>

    <div class="archive-divider"></div>

    <div class="archive-meta-row">
      <span>ceramic</span>
      <span>Ongoing series</span>
      <span>München</span>
    </div>

    <div class="archive-divider"></div>

    <!--
      DOODLE IMAGE
      One static image, drawn once. Doesn't change per project.
      Replace the src below with your actual doodle-table illustration.
    -->
    <img src="images/ceramica-doodle.jpg" alt="Illustrated table of numbered ceramic pieces" class="archive-doodle">

    <div class="archive-divider"></div>

    <p class="archive-general-label">General</p>

    <div class="archive-divider"></div>

    <!--
      NUMBER NAV
      Clicking a number shows that project's panel below — nothing
      scrolls, every other panel stays hidden. Add more <a> tags
      here as you add more numbered panels below.
    -->
    <nav class="archive-nav">
      <a href="#" data-project="1">1</a>
      <a href="#" data-project="2">2</a>
      <a href="#" data-project="3">3</a>
      <a href="#" data-project="4">4</a>
      <a href="#" data-project="5">5</a>
      <a href="#" data-project="6">6</a>
      <a href="#" data-project="7">7</a>
      <a href="#" data-project="8">8</a>
      <a href="#" data-project="9">9</a>
    </nav>

    <div class="archive-divider"></div>

  <!--
      NUMBER NAV
      Clicking a number shows that project's panel below — nothing
      scrolls, every other panel stays hidden. Add more <a> tags
      here as you add more numbered panels below.
    -->
    <nav class="archive-nav">
      <a href="#" data-project="general">General</a><span class="sep">|</span>
      <a href="#" data-project="1">1</a><span class="sep">|</span>
      <a href="#" data-project="2">2</a><span class="sep">|</span>
      <a href="#" data-project="3">3</a><span class="sep">|</span>
      <a href="#" data-project="4">4</a><span class="sep">|</span>
      <a href="#" data-project="5">5</a><span class="sep">|</span>
      <a href="#" data-project="6">6</a><span class="sep">|</span>
      <a href="#" data-project="7">7</a><span class="sep">|</span>
      <a href="#" data-project="8">8</a>
    </nav>
 
    <div class="archive-divider"></div>
 
    <!--
      PANELS
      One per number. Only the active one is visible at a time.
      Arrange the inside of each however that project needs — a
      single photo, a grid, a caption, whatever fits. Mix and match
      the helper classes (.gallery-single, .gallery-grid,
      .gallery-grid-3, .gallery-stack) or write your own layout.
 
      TO ADD A NEW NUMBER LATER: copy one whole panel block, change
      data-project to the new number, swap the content inside, and
      add one matching <a> in the nav above.
    -->
 
    <!-- Project 1 -->
    <div class="gallery-panel" data-project="1">
      <p class="gallery-panel-title">Project 1</p>
      <div class="gallery-stack">
        <img src="images/ceramica-candledancer1.jpg" alt="">
        <img src="images/ceramica-candledancer2.jpg" alt="">
        <img src="images/ceramica-candledancer3.jpg" alt="">
        <img src="images/ceramica-candledancer4.jpg" alt="">
        <img src="images/ceramica-candledancer5.jpg" alt="">
        <img src="images/ceramica-candledancer6.jpg" alt="">
      </div>
    </div>
 
    <!-- Project 2 -->
    <div class="gallery-panel" data-project="2">
      <p class="gallery-panel-title">Project 2</p>
      <div class="gallery-stack">
        <img src="images/ceramica-lampara2.jpg" alt="">
        <img src="images/ceramica-lampara1.jpg" alt="">
      </div>
    </div>
 
    <!-- Project 3 -->
    <div class="gallery-panel" data-project="3">
      <p class="gallery-panel-title">Feel Good + Ayez</p>
      <div class="gallery-stack">
        <img src="images/ceramica-graphiccoasters1.jpg" alt="">
        <img src="images/ceramica-graphiccoasters3.jpg" alt="">
        <img src="images/ceramica-graphiccoasters2.jpg" alt="">
      </div>
    </div>
 
    <!-- Project 4 -->
    <div class="gallery-panel" data-project="4">
      <p class="gallery-panel-title">Goblets</p>
      <div class="gallery-stack">
        <img src="images/ceramica-goblet3.jpg" alt="">
        <img src="images/ceramica-goblet1.jpg" alt="">
        <img src="images/ceramica-goblet4.jpg" alt="">
        <img src="images/ceramica-goblet2.jpg" alt="">
      </div>
    </div>
 
    <!-- Project 5 -->
    <div class="gallery-panel" data-project="5">
      <p class="gallery-panel-title">Bowls</p>
      <div class="gallery-stack">
        <img src="images/ceramica-bowls1.jpg" alt="">
        <img src="images/ceramica-bowls3.jpg" alt="">
        <img src="images/ceramica-bowls2.jpg" alt="">
      </div>
    </div>
 
    <!-- General (shown by default) -->
    <div class="gallery-panel" data-project="general" data-default>
      <p class="gallery-panel-title"> </p>
      <div class="gallery-stack">
        <img src="images/ceramica-todo2.jpg" alt="">
        <img src="images/ceramica-todo1.jpg" alt="">
      </div>
    </div>
 
    <!-- Project 6 -->
    <div class="gallery-panel" data-project="6">
      <p class="gallery-panel-title">Radial Coasters</p>
      <div class="gallery-stack">
        <img src="images/ceramica-4coasters1.jpg" alt="">
        <img src="images/ceramica-4coasters4.jpg" alt="">
        <img src="images/ceramica-4coasters2.jpg" alt="">
        <img src="images/ceramica-4coasters3.jpg" alt="">
      </div>
    </div>
 
    <!-- Project 7 -->
    <div class="gallery-panel" data-project="7">
      <p class="gallery-panel-title">Pescado</p>
      <div class="gallery-stack">
        <img src="images/ceramica-pescado3.jpg" alt="">
        <img src="images/ceramica-pescado1.jpg" alt="">
        <img src="images/ceramica-pescado2.jpg" alt="">
      </div>
    </div>
 
    <!-- Project 8 -->
    <div class="gallery-panel" data-project="8">
      <p class="gallery-panel-title">hsdjfjdj 8</p>
      <div class="gallery-stack">
        <img src="images/ceramica-marron1.jpg" alt="">
        <img src="images/ceramica-marron1.jpg" alt="">
      </div>
    </div>
 

    <div class="archive-divider"></div>

    <a href="index.html" class="back-link">← back to everything</a>

  </div>

  <script src="gallery-switcher.js"></script>

</body>
</html>
