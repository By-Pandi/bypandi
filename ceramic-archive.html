<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceramic Archive — By Pandi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="pages.css">
</head>
<body>

  <div class="page-wrap">

    <header class="page-header">
      <span class="site-name">By Pandi</span>
      <img src="images/logo.jpg" alt="By Pandi logo">
      <a href="index.html" class="back-link">← back to everything</a>
    </header>

    <p class="archive-tag">##</p>
    <div class="archive-divider"></div>

    <h1 class="archive-title">Ceramic archive</h1>

    <div class="archive-divider"></div>

    <div class="archive-meta-row">
      <span>ceramic, stoneware</span>
      <span>ongoing series</span>
      <span>München</span>
    </div>

    <div class="archive-divider"></div>

    <!--
      DOODLE IMAGE
      One static image, drawn once. Doesn't change per project.
      Replace the src below with your actual doodle-table illustration.
    -->
    <img src="images/ceramic-doodle.jpg" alt="Illustrated table of numbered ceramic pieces" class="archive-doodle">

    <div class="archive-divider"></div>

    <p class="archive-general-label">General</p>

    <div class="archive-divider"></div>

    <!--
      NUMBER NAV
      Clicking a number shows that project's panel below — nothing
      scrolls, every other panel stays hidden. Add more <a> tags
      here as you add more numbered panels below.
    -->
    <nav class="archive-nav">
      <a href="#" data-project="1">1</a>
      <a href="#" data-project="2">2</a>
      <a href="#" data-project="3">3</a>
      <a href="#" data-project="4">4</a>
      <a href="#" data-project="5">5</a>
      <a href="#" data-project="6">6</a>
      <a href="#" data-project="7">7</a>
      <a href="#" data-project="8">8</a>
      <a href="#" data-project="9">9</a>
    </nav>

    <div class="archive-divider"></div>

    <!--
      PANELS
      One per number. Only the active one is visible at a time.
      Arrange the inside of each however that project needs — a
      single photo, a grid, a caption, whatever fits. Mix and match
      the helper classes (.gallery-single, .gallery-grid,
      .gallery-grid-3, .gallery-stack) or write your own layout.

      TO ADD A NEW NUMBER LATER: copy one whole panel block, change
      data-project to the new number, swap the content inside, and
      add one matching <a> in the nav above.
    -->

    <!-- Image 1: six photos, 2 per row -->
    <div class="gallery-panel" data-project="1">
      <p class="gallery-panel-title">Project 1</p>
      <div class="gallery-grid">
        <img src="images/ceramic-1a.jpg" alt="">
        <img src="images/ceramic-1b.jpg" alt="">
        <img src="images/ceramic-1c.jpg" alt="">
        <img src="images/ceramic-1d.jpg" alt="">
        <img src="images/ceramic-1e.jpg" alt="">
        <img src="images/ceramic-1f.jpg" alt="">
      </div>
    </div>

    <!-- Image 2: four photos, stacked in a single column -->
    <div class="gallery-panel" data-project="2">
      <p class="gallery-panel-title">Project 2</p>
      <div class="gallery-stack">
        <img src="images/ceramic-2a.jpg" alt="">
        <img src="images/ceramic-2b.jpg" alt="">
        <img src="images/ceramic-2c.jpg" alt="">
        <img src="images/ceramic-2d.jpg" alt="">
      </div>
    </div>

    <!-- Image 3: three photos, stacked in a single column -->
    <div class="gallery-panel" data-project="3">
      <p class="gallery-panel-title">Project 3</p>
      <div class="gallery-stack">
        <img src="images/ceramic-3a.jpg" alt="">
        <img src="images/ceramic-3b.jpg" alt="">
        <img src="images/ceramic-3c.jpg" alt="">
      </div>
    </div>

    <!-- Image 4: two photos side by side -->
    <div class="gallery-panel" data-project="4">
      <p class="gallery-panel-title">Project 4</p>
      <div class="gallery-grid">
        <img src="images/ceramic-4a.jpg" alt="">
        <img src="images/ceramic-4b.jpg" alt="">
      </div>
    </div>

    <!-- Image 5: one large photo on top, two smaller photos side by side below -->
    <div class="gallery-panel" data-project="5">
      <p class="gallery-panel-title">Project 5</p>
      <div class="gallery-single">
        <img src="images/ceramic-5a.jpg" alt="">
      </div>
      <div class="gallery-grid" style="margin-top: 20px;">
        <img src="images/ceramic-5b.jpg" alt="">
        <img src="images/ceramic-5c.jpg" alt="">
      </div>
    </div>

    <!-- Image 6: two full-width photos, stacked -->
    <div class="gallery-panel" data-project="6" data-default>
      <p class="gallery-panel-title">General</p>
      <div class="gallery-stack">
        <img src="images/ceramic-6a.jpg" alt="" style="max-width: 100%;">
        <img src="images/ceramic-6b.jpg" alt="" style="max-width: 100%;">
      </div>
    </div>

    <!-- Image 7: three photos in a row, then two side by side, then one large -->
    <div class="gallery-panel" data-project="7">
      <p class="gallery-panel-title">Project 7</p>
      <div class="gallery-grid-3">
        <img src="images/ceramic-7a.jpg" alt="">
        <img src="images/ceramic-7b.jpg" alt="">
        <img src="images/ceramic-7c.jpg" alt="">
      </div>
      <div class="gallery-grid" style="margin-top: 20px;">
        <img src="images/ceramic-7d.jpg" alt="">
        <img src="images/ceramic-7e.jpg" alt="">
      </div>
      <div class="gallery-single" style="margin-top: 20px;">
        <img src="images/ceramic-7f.jpg" alt="">
      </div>
    </div>

    <!-- Image 8: two photos, stacked -->
    <div class="gallery-panel" data-project="8">
      <p class="gallery-panel-title">Project 8</p>
      <div class="gallery-stack">
        <img src="images/ceramic-8a.jpg" alt="">
        <img src="images/ceramic-8b.jpg" alt="">
      </div>
    </div>

    <!-- Image 9: three photos, stacked -->
    <div class="gallery-panel" data-project="9">
      <p class="gallery-panel-title">Project 9</p>
      <div class="gallery-stack">
        <img src="images/ceramic-9a.jpg" alt="">
        <img src="images/ceramic-9b.jpg" alt="">
        <img src="images/ceramic-9c.jpg" alt="">
      </div>
    </div>

    <div class="archive-divider"></div>

    <a href="index.html" class="back-link">← back to everything</a>

  </div>

  <script src="gallery-switcher.js"></script>

</body>
</html>
