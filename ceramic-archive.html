<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceramic Archive — By Pandi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="pages.css">
</head>
<body>

  <div class="page-wrap">

    <header class="page-header">
      <span class="site-name">By Pandi</span>
      <img src="images/logo.jpg" alt="By Pandi logo">
      <a href="index.html" class="back-link">← back to everything</a>
    </header>

    <p class="archive-tag">##</p>
    <div class="archive-divider"></div>

    <h1 class="archive-title">Ceramic archive</h1>

    <div class="archive-divider"></div>

    <div class="archive-meta-row">
      <span>ceramic, stoneware</span>
      <span>ongoing series</span>
      <span>München</span>
    </div>

    <div class="archive-divider"></div>

    <!--
      DOODLE IMAGE
      One static image, drawn once. Doesn't change per project.
      Replace the src below with your actual doodle-table illustration.
    -->
    <img src="images/ceramic-doodle.jpg" alt="Illustrated table of numbered ceramic pieces" class="archive-doodle">

    <div class="archive-divider"></div>

    <p class="archive-general-label">General</p>

    <div class="archive-divider"></div>

    <!--
      NUMBER NAV
      Clicking a number shows that project's panel below — nothing
      scrolls, every other panel stays hidden. Add more <a> tags
      here as you add more numbered panels below.
    -->
    <nav class="archive-nav">
      <a href="#" data-project="1">1</a>
      <a href="#" data-project="2">2</a>
      <a href="#" data-project="3">3</a>
      <a href="#" data-project="4">4</a>
      <a href="#" data-project="5">5</a>
      <a href="#" data-project="6">6</a>
      <a href="#" data-project="7">7</a>
      <a href="#" data-project="8">8</a>
    </nav>

    <div class="archive-divider"></div>

    <!--
      PANELS
      One per number. Only the active one is visible at a time.
      Arrange the inside of each however that project needs — a
      single photo, a grid, a caption, whatever fits. Mix and match
      the helper classes (.gallery-single, .gallery-grid,
      .gallery-grid-3, .gallery-stack) or write your own layout.

      TO ADD A NEW NUMBER LATER: copy one whole panel block, change
      data-project to the new number, swap the content inside, and
      add one matching <a> in the nav above.
    -->

    <div class="gallery-panel" data-project="1">
      <p class="archive-section-title">Coaster set</p>
      <div class="gallery-single">
        <img src="images/ceramic-1.jpg" alt="Coaster set">
      </div>
      <p class="gallery-caption">Stoneware, glazed, 2026.</p>
    </div>

    <div class="gallery-panel" data-project="2">
      <p class="archive-section-title">Ceramic shelves</p>
      <div class="gallery-grid">
        <img src="images/ceramic-2a.jpg" alt="Ceramic shelves, view 1">
        <img src="images/ceramic-2b.jpg" alt="Ceramic shelves, view 2">
      </div>
    </div>

    <div class="gallery-panel" data-project="3">
      <p class="archive-section-title">Feel good</p>
      <div class="gallery-single">
        <img src="images/ceramic-3.jpg" alt="Feel good piece">
      </div>
    </div>

    <div class="gallery-panel" data-project="4">
      <p class="archive-section-title">Upties</p>
      <div class="gallery-grid-3">
        <img src="images/ceramic-4a.jpg" alt="Upties, view 1">
        <img src="images/ceramic-4b.jpg" alt="Upties, view 2">
        <img src="images/ceramic-4c.jpg" alt="Upties, view 3">
      </div>
    </div>

    <div class="gallery-panel" data-project="5">
      <p class="archive-section-title">Bowls</p>
      <div class="gallery-stack">
        <img src="images/ceramic-5a.jpg" alt="Bowls, stacked">
        <img src="images/ceramic-5b.jpg" alt="Bowls, close-up">
      </div>
    </div>

    <div class="gallery-panel" data-project="6">
      <p class="archive-section-title">Tiles</p>
      <div class="gallery-grid">
        <img src="images/ceramic-6a.jpg" alt="Tiles, view 1">
        <img src="images/ceramic-6b.jpg" alt="Tiles, view 2">
      </div>
    </div>

    <div class="gallery-panel" data-project="7">
      <p class="archive-section-title">Arch stands</p>
      <div class="gallery-single">
        <img src="images/ceramic-7.jpg" alt="Arch stands">
      </div>
      <p class="gallery-caption">Feel good.</p>
    </div>

    <div class="gallery-panel" data-project="8">
      <p class="archive-section-title">General</p>
      <div class="gallery-grid">
        <img src="images/ceramic-8a.jpg" alt="General view 1">
        <img src="images/ceramic-8b.jpg" alt="General view 2">
      </div>
    </div>

    <div class="archive-divider"></div>

    <a href="index.html" class="back-link">← back to everything</a>

  </div>

  <script src="gallery-switcher.js"></script>

</body>
</html>
  </div>

</body>
</html>
